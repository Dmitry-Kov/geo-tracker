name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # ubuntu-latest (26.04) has no Python 3.9 builds in setup-python's
    # manifest; 24.04 LTS carries both 3.9 and 3.12.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies (exact lock — identical on 3.9 and 3.12)
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests (no API keys, no network calls)
        run: python -m pytest tests/ -q
